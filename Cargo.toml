[package]
name = "cidrrr"
version = "2026.2.17"
edition = "2024"
authors = ["Stefan Ruzitschka <stefan@icepuma.dev>"]
description = "Convert a CIDR block to a list of IPs"
keywords = ["ip", "cidr", "ipv4", "ipv6"]
repository = "https://github.com/icepuma/cidrrr"
readme = "README.md"
license-file = "LICENSE"

[dependencies]
clap = { version = "4.5.60", features = ["cargo", "derive"] }
ipnet = "2.11.0"
num-bigint = "0.4.6"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
